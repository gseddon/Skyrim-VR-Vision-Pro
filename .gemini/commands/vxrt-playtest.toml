description = "Have the user play Skyrim on the Mac dev host and find where it fails — start a playtest, then read its marks, answers and problems"
prompt = "Help the user playtest Skyrim VR on the Mac dev host (keyboard controllers), then turn what went wrong into the next work. `{{args}}`\n\n1. A playtest is the user's: they run it in their own Terminal, `python3 tools/vxrt_playtest.py skyrim` (it starts `tools/play_skyrim_dev.sh` with evidence in `runs/<id>/native`). Tell them: press Enter in the Terminal where something goes wrong (with a note); quit the game or press Ctrl-C to end; then answer the checklist. Do not start it yourself, and do not start other Skyrim runs meanwhile.\n2. When they are done, read it: vxrt MCP `read_playtests` (or `python3 tools/vxrt_playtest.py --show skyrim`, and `runs/<id>/playtest.json`). Look at every problem: each mark's startup-log tail, the \"no\" answers, crashes, slow stretches.\n3. Report the problems in the order they happened, each with what you think it is (say when it is only a suspicion), and whether `dev_host_ok` holds. This is never a \"playable\" verdict: only a human physical-headset session establishes that. Offer `/vxrt-support` for the ones in VXRuntime, `/vxrt-tune` for slow stretches, and `python3 tools/vxrt_playtest.py --apply runs/<id>` (the user's choice) to record it in the profile.\n"
