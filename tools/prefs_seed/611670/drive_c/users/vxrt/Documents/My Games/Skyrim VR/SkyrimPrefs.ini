; Authored for VXRuntime dev runs (not a game file): the answers to Skyrim VR's first-launch VR setup, so
; dev runs start at the main menu. Copied into each run's private root by tools/vxrt_native_startup.py --prefs-seed.
[VR]
bOneTimeCalibrationCompleted=1
[VRInput]
bLeftHandedMode=0
[Display]
; The game asks for a 1024x1024 desktop window (its own default) but a 1920x1080 back buffer, and draws the left eye
; 1:1 into the top-left of the buffer; a window of another shape then squeezes it. Same size for both: the eye fills it.
iSize W=1024
iSize H=1024
bFull Screen=0
